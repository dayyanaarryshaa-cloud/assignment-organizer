<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Organizer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #20242a;
    }
    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .container { max-width: 760px; margin: auto; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle { margin: 0; color: #667085; }
    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }
    button, .file-label {
      display: inline-block;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      background: #20242a;
      color: white;
    }
    input[type="file"] { display: none; }
    .hint { color: #667085; font-size: 13px; margin-top: 10px; }
    .assignment {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .assignment h3 { margin: 0 0 8px; }
    .meta { color: #667085; font-size: 14px; margin-bottom: 10px; }
    .instructions { line-height: 1.5; }
    .deadline {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .deadline input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .complete {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .empty {
      text-align: center;
      color: #667085;
      padding: 35px 10px;
    }
    #preview { max-width: 100%; margin-top: 15px; border-radius: 10px; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Assignment Organizer</h1>
      <p class="subtitle">Keep assignment information separate from busy group chats.</p>
    </div>
  </header>

  <main class="container">
    <section class="upload-box">
      <label class="file-label" for="screenshot">Upload Screenshot</label>
      <input id="screenshot" type="file" accept="image/*">
      <p class="hint">Upload an assignment screenshot to create an organized assignment card.</p>
      <img id="preview" alt="Uploaded assignment screenshot">
    </section>

    <section id="assignments">
      <div class="empty" id="empty">No assignments yet. Upload a screenshot to get started.</div>
    </section>
  </main>

<script>
const input = document.getElementById("screenshot");
const preview = document.getElementById("preview");
const list = document.getElementById("assignments");
const empty = document.getElementById("empty");

input.addEventListener("change", () => {
  const file = input.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  // Prototype: the user confirms/edits extracted text manually.
  const assignment = {
    subject: "New Assignment",
    name: file.name.replace(/\.[^/.]+$/, ""),
    instructions: "Edit this text with the full assignment instructions from your screenshot.",
    deadline: "",
    completed: false,
    image: preview.src
  };

  empty.style.display = "none";
  const card = document.createElement("article");
  card.className = "assignment";
  card.innerHTML = `
    <h3 contenteditable="true">${escapeHtml(assignment.name)}</h3>
    <div class="meta" contenteditable="true">${assignment.subject}</div>
    <div class="instructions" contenteditable="true">${assignment.instructions}</div>
    <div class="deadline">
      <strong>Deadline:</strong>
      <input type="date" aria-label="Assignment deadline">
    </div>
    <label class="complete">
      <input type="checkbox">
      Mark as completed
    </label>
    <details style="margin-top:14px">
      <summary>View original screenshot</summary>
      <img src="${assignment.image}" alt="Original assignment screenshot" style="max-width:100%;margin-top:10px;border-radius:10px">
    </details>
  `;

  card.querySelector("input[type=date]").addEventListener("change", e => {
    assignment.deadline = e.target.value;
  });
  card.querySelector("input[type=checkbox]").addEventListener("change", e => {
    assignment.completed = e.target.checked;
    card.style.opacity = assignment.completed ? "0.6" : "1";
  });

  list.prepend(card);
  input.value = "";
});

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
